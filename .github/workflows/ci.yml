# ------------------------------------------------------------------------------
# OpsPilot -- Intégration continue
# ------------------------------------------------------------------------------
# S'exécute sur les serveurs GitHub à chaque push et chaque pull request.
# Aucune ressource consommée sur le poste de développement -- point important
# ici, où la mémoire disponible est la contrainte principale.
#
# Quatre travaux indépendants, exécutés EN PARALLÈLE :
#   tests    -- les 235 tests, contre un vrai PostgreSQL éphémère
#   qualite  -- analyse statique (ruff)
#   secrets  -- recherche d'identifiants dans le code ET dans l'historique
#   deps     -- vulnérabilités connues des dépendances (Trivy)
#   image    -- construction de l'image Docker + scan de l'image produite
#
# Le parallélisme est délibéré : un échec de lint ne doit pas masquer un
# échec de test, et inversement. On veut TOUS les problèmes en un seul
# passage, pas le premier rencontré.
name: CI

on:
  push:
    branches: [opspilot-v6, main, master]
  pull_request:
    branches: [opspilot-v6, main, master]
  # Permet de relancer le pipeline à la demande depuis l'onglet Actions,
  # utile pour une démonstration en direct sans avoir à pousser un commit.
  workflow_dispatch:

jobs:

  # ------------------------------------------------------------------------
  # Tests -- avec un VRAI PostgreSQL, pas le repli mémoire
  # ------------------------------------------------------------------------
  # Point important : en local, les tests s'exécutent souvent sans base
  # accessible et empruntent alors le repli mémoire de database.py. Les
  # vrais chemins SQL (INSERT, UPDATE, la requête de déduplication
  # donnees->>'target') ne sont donc jamais exercés. Ce service PostgreSQL
  # éphémère corrige ce trou de couverture : la CI teste ce que la
  # production exécute réellement.
  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 est la version de développement. 3.11 vérifie qu'aucune
        # syntaxe trop récente ne s'est glissée dans le code -- utile pour
        # un déploiement client sur une distribution plus ancienne.
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_secret
        ports:
          - 5432:5432
        # Sans ce contrôle de santé, les tests démarrent avant que
        # PostgreSQL n'accepte les connexions et échouent au hasard.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          # PyTorch AVANT le reste, depuis l'index CPU : sinon pip
          # récupère la variante GPU (plus de 2 Go de bibliothèques CUDA)
          # pour un modèle LSTM qui tourne très bien sur processeur.
          # Voir le commentaire correspondant dans requirements.txt.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "::warning::requirements.txt absent -- installation de la liste minimale"
            pip install fastapi uvicorn psycopg2-binary requests python-dotenv \
                        bcrypt paramiko fpdf2 numpy scikit-learn
          fi
          pip install pytest pytest-cov httpx

      - name: Attendre que PostgreSQL soit prêt
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U opspilot && break
            sleep 1
          done

      - name: Lancer la suite de tests
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: opspilot
          DB_USER: opspilot
          DB_PASSWORD: opspilot_secret
          # Valeurs factices : aucun appel réseau réel n'est fait pendant
          # les tests, mais ces variables doivent exister pour que les
          # modules s'importent sans avertissement bloquant.
          GROQ_API_KEY: cle-factice-ci
          SIGNUP_INVITE_CODE: code-ci
          PROMETHEUS_URL: http://localhost:9090
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Publier le rapport de couverture
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: coverage.xml
          retention-days: 14

  # ------------------------------------------------------------------------
  # Qualité du code
  # ------------------------------------------------------------------------
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer ruff
        run: pip install ruff

      # Deux passes délibérément séparées.
      # La première BLOQUE : erreurs de syntaxe, noms non définis, imports
      # cassés -- des défauts qui font planter en production.
      # La seconde INFORME : style, imports inutilisés, lignes trop longues.
      # Un projet existant a toujours des écarts de style ; les traiter
      # comme bloquants rendrait le pipeline rouge en permanence, et un
      # pipeline toujours rouge n'est plus lu par personne.
      - name: Erreurs bloquantes
        run: ruff check . --select=E9,F63,F7,F82 --output-format=full

      - name: Style et bonnes pratiques (informatif)
        run: ruff check . --statistics || true

  # ------------------------------------------------------------------------
  # Recherche de secrets -- code ET historique
  # ------------------------------------------------------------------------
  # Ce projet manipule un mot de passe root Proxmox, un secret de jeton API
  # et des clés de fournisseurs LLM. Un secret committé par inadvertance
  # reste dans l'historique Git de façon permanente, même après suppression
  # du fichier -- d'où fetch-depth: 0, qui récupère TOUT l'historique et non
  # le dernier commit seulement.
  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------------
  # Vulnérabilités des dépendances
  # ------------------------------------------------------------------------
  deps:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy -- analyse du système de fichiers
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          # CRITICAL et HIGH seulement : signaler les vulnérabilités
          # mineures d'une dépendance transitive noierait les vraies
          # alertes sous du bruit.
          severity: CRITICAL,HIGH
          format: table
          # exit-code 0 : informe sans bloquer. Une CVE peut apparaître
          # dans une dépendance sans correctif disponible -- bloquer le
          # pipeline ne la corrigerait pas, mais empêcherait tout le reste
          # d'avancer. Le rapport reste visible dans les logs.
          exit-code: '0'

  # ------------------------------------------------------------------------
  # Image Docker -- construction et analyse
  # ------------------------------------------------------------------------
  # Construite ICI et non sur le poste de développement. Deux raisons.
  #
  # Pratique : Docker Desktop exige WSL2, donc Hyper-V, qui entre en
  # conflit avec VMware Workstation -- sur lequel repose toute
  # l'infrastructure Proxmox de ce projet. Activer l'un casserait l'autre.
  #
  # Méthodologique : une image construite en CI est reproductible, alors
  # qu'une image construite localement dépend de l'état de la machine du
  # développeur. C'est la pratique attendue en production.
  #
  # L'image n'est PAS publiée : on vérifie qu'elle se construit et qu'elle
  # est saine. La publication vers un registre viendra avec le déploiement.
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: opspilot:ci
          # Cache partagé entre exécutions : sans lui, chaque build
          # réinstalle PyTorch et toutes les dépendances Python depuis
          # zéro -- plusieurs minutes à chaque push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier que le conteneur démarre
        run: |
          # On ne teste pas l'application complète (elle exige PostgreSQL
          # et Proxmox), seulement que l'image est exécutable et que
          # Python peut importer les modules. Un ImportError ici
          # signalerait une dépendance absente de l'image.
          docker run --rm --entrypoint python opspilot:ci -c \
            "import fastapi, psycopg2, paramiko, numpy, sklearn, torch; print('Imports OK')"

      - name: Vérifier que l'image ne tourne pas en root
        run: |
          # Un conteneur en root est le premier point relevé par un audit
          # de sécurité : en cas d'évasion, l'attaquant serait root sur
          # l'hôte. Ce contrôle garantit que la directive USER du
          # Dockerfile n'a pas été perdue lors d'une modification.
          UTILISATEUR=$(docker run --rm --entrypoint id opspilot:ci -un)
          echo "L'image s'execute en tant que : $UTILISATEUR"
          if [ "$UTILISATEUR" = "root" ]; then
            echo "::error::L'image s'execute en root -- la directive USER du Dockerfile a disparu"
            exit 1
          fi

      - name: Trivy -- analyse de l'image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: opspilot:ci
          severity: CRITICAL,HIGH
          format: table
          # Informatif, comme pour l'analyse des dépendances : une CVE
          # d'une image de base sans correctif disponible ne doit pas
          # bloquer tout le pipeline. Le rapport reste consultable.
          exit-code: '0'

  # ------------------------------------------------------------------------
  # Manifestes Kubernetes -- validation et bonnes pratiques
  # ------------------------------------------------------------------------
  # Sans ce travail, une erreur dans un manifeste n'est decouverte qu'au
  # moment du deploiement -- sur le cluster, avec des ressources deja
  # modifiees. Le valider en CI la revele au commit, avant tout impact.
  #
  # Trois outils, trois roles distincts :
  #   kustomize  -- les overlays s'assemblent-ils ?
  #   kubeconform -- les manifestes respectent-ils le schema de l'API ?
  #   kube-score  -- respectent-ils les bonnes pratiques ?
  #
  # Le premier attrape une reference cassee, le deuxieme un champ invalide,
  # le troisieme une sonde absente ou un conteneur en root. Aucun ne
  # remplace les deux autres.
  kubernetes:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer les outils de validation
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz kustomize
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          curl -sL https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64.tar.gz | tar xz kube-score
          sudo mv kustomize kubeconform kube-score /usr/local/bin/

      - name: Assembler chaque environnement
        run: |
          for env in base overlays/minikube overlays/dev overlays/prod; do
            echo "::group::$env"
            kustomize build "k8s/$env" > "/tmp/$(basename $env).yaml"
            echo "  $(grep -c '^kind:' /tmp/$(basename $env).yaml) ressources"
            echo "::endgroup::"
          done

      - name: Valider contre le schema de l'API Kubernetes
        run: |
          # -strict : signale les champs INCONNUS. Sans cette option, une
          # faute de frappe ("readinesProbe") passe inapercue -- Kubernetes
          # ignore silencieusement ce qu'il ne connait pas, et la sonde
          # n'existe tout simplement pas.
          for f in /tmp/*.yaml; do
            echo "::group::$(basename $f)"
            kubeconform -summary -strict -kubernetes-version 1.31.0 \
              -ignore-missing-schemas "$f"
            echo "::endgroup::"
          done

      - name: Verifier les bonnes pratiques
        run: |
          # Informatif volontairement (|| true) : kube-score signale des
          # points legitimement discutables (image sans digest, absence
          # de NetworkPolicy sur certains objets). Les rendre bloquants
          # rendrait le pipeline rouge en permanence -- et un pipeline
          # toujours rouge n'est plus lu.
          kube-score score /tmp/prod.yaml --output-format ci || true

      - name: Controles specifiques a ce projet
        run: |
          # Trois regles que kube-score ne verifie pas, et qui viennent
          # de defauts reellement rencontres sur ce projet.
          echec=0

          # 1. Aucun Secret avec une valeur reelle dans le depot.
          #    Un Secret n'est qu'encode en base64, pas chiffre : le
          #    committer rempli equivaut a committer un mot de passe.
          if grep -rE '^\s+[A-Z_]+:\s+"[^"]+"' k8s/base/secret.yaml 2>/dev/null | grep -v ': ""'; then
            echo "::error::secret.yaml contient une valeur non vide"
            echec=1
          fi

          # 2. Aucune image en :latest dans l'overlay de production.
          #    Deux pods de la meme application pourraient tourner avec
          #    des images differentes selon leur date de creation.
          if grep -E 'image:.*:latest' /tmp/prod.yaml; then
            echo "::error::image en :latest dans l'overlay de production"
            echec=1
          fi

          # 3. Tout conteneur doit declarer des limites.
          #    Sans elles, un pod peut consommer toute la memoire du
          #    noeud et faire tomber ses voisins -- constate en reel sur
          #    ce projet, ou le control plane est tombe a 9 Mo libres.
          python3 - <<'PY'
          import yaml, sys
          manquants = []
          for d in yaml.safe_load_all(open('/tmp/prod.yaml')):
              if not d or d.get('kind') not in ('Deployment', 'StatefulSet'):
                  continue
              spec = d['spec']['template']['spec']
              for c in spec.get('initContainers', []) + spec['containers']:
                  if 'limits' not in c.get('resources', {}):
                      manquants.append(f"{d['metadata']['name']}/{c['name']}")
          if manquants:
              print(f"::error::conteneurs sans limits : {', '.join(manquants)}")
              sys.exit(1)
          print("Tous les conteneurs declarent des limites")
          PY

          exit $echec

  # ------------------------------------------------------------------------
  # Chart Helm
  # ------------------------------------------------------------------------
  helm:
    name: Chart Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint ./helm/opspilot

      - name: Rendre le chart et le valider
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          # Un gabarit Helm n'est pas du YAML valide tant qu'il n'est pas
          # RENDU -- d'ou cette etape, inutile avec Kustomize dont les
          # fichiers de base sont directement validables.
          helm template opspilot ./helm/opspilot \
            | kubeconform -summary -strict -kubernetes-version 1.31.0 -ignore-missing-schemas -
          helm template opspilot ./helm/opspilot -f ./helm/opspilot/values-minikube.yaml \
            | kubeconform -summary -strict -kubernetes-version 1.31.0 -ignore-missing-schemas -