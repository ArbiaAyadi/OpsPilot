# ---------------------------------------------------------------------------
# Configuration Ansible - OpsPilot
# ---------------------------------------------------------------------------
[defaults]
inventory            = inventory.ini
host_key_checking    = False
# stdout_callback = yaml : sortie lisible plutot qu'une seule ligne JSON
# illisible par tache. Sur un playbook qu'on lit en direct devant
# quelqu'un, la lisibilite de la sortie compte autant que le resultat.
stdout_callback      = yaml
# Affiche la duree de chaque tache : utile pour reperer ce qui ralentit
# un playbook, et pour montrer qu'une seconde execution est quasi
# instantanee (idempotence).
callbacks_enabled    = profile_tasks
interpreter_python   = auto_silent
retry_files_enabled  = False

[ssh_connection]
# pipelining reduit fortement le nombre d'operations SSH par tache.
# Necessite requiretty desactive sur les cibles, ce qui est le cas par
# defaut sur Debian.
pipelining = True