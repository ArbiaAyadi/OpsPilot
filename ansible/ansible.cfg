# ---------------------------------------------------------------------------
# Configuration Ansible - OpsPilot
# ---------------------------------------------------------------------------
[defaults]
inventory            = inventory.ini
host_key_checking    = False
# result_format = yaml plutot que "stdout_callback = yaml" : ce dernier
# vient de la collection community.general et est DEPRECIE depuis
# ansible-core 2.13 (avertissement visible a chaque execution). L'option
# equivalente du callback par defaut fait la meme chose sans dependance
# externe ni message de depreciation. Objectif identique : une sortie
# lisible plutot qu'une ligne JSON compacte par tache.
result_format        = yaml
# Affiche la duree de chaque tache : utile pour reperer ce qui ralentit
# un playbook, et pour montrer qu'une seconde execution est quasi
# instantanee (idempotence).
callbacks_enabled    = profile_tasks
interpreter_python   = auto_silent
retry_files_enabled  = False

[ssh_connection]
# pipelining reduit fortement le nombre d'operations SSH par tache.
# Necessite requiretty desactive sur les cibles, ce qui est le cas par
# defaut sur Debian.
pipelining = True