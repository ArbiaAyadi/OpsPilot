# ---------------------------------------------------------------------------
# Inventaire - quelles machines Ansible administre
# ---------------------------------------------------------------------------
# Les machines sont regroupees par ROLE, pas par nom. C'est ce qui permet
# au playbook de dire "applique ce reglage a tous les noeuds Proxmox"
# sans jamais nommer pve1 ni pve2 : ajouter un pve3 demain se fait en une
# ligne ici, sans toucher au playbook.

[proxmox_nodes]
pve1 ansible_host=192.168.138.100
pve2 ansible_host=192.168.138.101

[proxmox_nodes:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Les VMs invitees sont declarees mais COMMENTEES : l'acces SSH depuis
# pve1 vers ces machines n'est pas encore configure. Les decommenter une
# fois ssh-copy-id fait, et le meme playbook les couvrira.
# [guest_vms]
# linux-vm1 ansible_host=192.168.138.133 ansible_user=arbia
# linux-vm2 ansible_host=192.168.138.137 ansible_user=arbia