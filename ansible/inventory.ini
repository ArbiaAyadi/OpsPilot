# ---------------------------------------------------------------------------
# Inventaire - quelles machines Ansible administre
# ---------------------------------------------------------------------------
# Les machines sont regroupees par ROLE, pas par nom. C'est ce qui permet
# au playbook de dire "applique ce reglage a tous les noeuds Proxmox"
# sans jamais nommer pve1 ni pve2 : ajouter un pve3 demain se fait en une
# ligne ici, sans toucher au playbook.

[proxmox_nodes]
pve1 ansible_host=192.168.138.100
pve2 ansible_host=192.168.138.101

[proxmox_nodes:vars]
ansible_user=root

# PAS de ansible_ssh_private_key_file ici, volontairement.
#
# Une premiere version imposait ~/.ssh/id_ed25519, ce qui a fait echouer
# le playbook avec "no such identity" alors que ssh root@pve2 fonctionnait
# parfaitement depuis la meme machine. La raison : les noeuds d'un cluster
# Proxmox partagent automatiquement leurs cles SSH a la formation du
# cluster, sous un autre nom de fichier.
#
# Sans cette directive, SSH utilise sa decouverte normale : agent, puis
# cles par defaut du repertoire ~/.ssh. Le playbook fonctionne donc
# quelle que soit la machine de controle, sans supposer un nom de cle
# precis -- ce qu'un inventaire n'a aucune raison de connaitre.

# Les VMs invitees sont declarees mais COMMENTEES : l'acces SSH depuis
# pve1 vers ces machines n'est pas encore configure. Les decommenter une
# fois ssh-copy-id fait, et le meme playbook les couvrira.
# [guest_vms]
# linux-vm1 ansible_host=192.168.138.133 ansible_user=arbia
# linux-vm2 ansible_host=192.168.138.137 ansible_user=arbia