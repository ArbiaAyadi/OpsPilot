---
# ---------------------------------------------------------------------------
# HorizontalPodAutoscaler : mise a l'echelle automatique
# ---------------------------------------------------------------------------
# Ajuste le NOMBRE de repliques selon la charge observee. A ne pas
# confondre avec le VerticalPodAutoscaler, qui ajuste les ressources
# d'un pod : horizontal = plus de pods, vertical = des pods plus gros.
#
# PREREQUIS : metrics-server doit etre installe dans le cluster. Sans
# lui, le HPA ne recoit aucune metrique et affiche "unknown" en
# permanence -- il ne fait alors rien, silencieusement.
#
# IMPORTANT : quand un HPA gere une ressource, le champ "replicas" du
# Deployment ne doit plus etre modifie a la main. Les deux se
# contrediraient a chaque cycle de reconciliation.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opspilot-app
  namespace: opspilot
  labels:
    app.kubernetes.io/name: opspilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opspilot-app

  minReplicas: 1
  maxReplicas: 5

  metrics:
    # Utilisation CPU moyenne, en pourcentage des REQUESTS (pas des
    # limits). Avec requests: 250m et une cible de 70%, le HPA ajoute
    # une replique quand la moyenne depasse 175m par pod.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    # Le comportement asymetrique est deliberé, et c'est un point qu'un
    # jury peut interroger.
    scaleUp:
      # Montee RAPIDE : 0 seconde de stabilisation. Face a un pic de
      # charge, attendre aggrave la situation -- les requetes
      # s'accumulent pendant qu'on hesite.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100          # jusqu'au doublement
          periodSeconds: 30
    scaleDown:
      # Descente LENTE : 5 minutes d'observation avant de retirer une
      # replique. Une charge qui retombe peut remonter aussitot ; retirer
      # trop vite produit un battement (scale up / down / up...) qui
      # coute plus cher que de garder une replique quelques minutes.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1            # une seule replique retiree a la fois
          periodSeconds: 60