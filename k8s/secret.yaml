---
# ---------------------------------------------------------------------------
# Secret : identifiants et cles d'API
# ---------------------------------------------------------------------------
# ATTENTION -- CE FICHIER NE CONTIENT AUCUNE VALEUR REELLE, ET NE DOIT
# JAMAIS EN CONTENIR.
#
# Un Secret Kubernetes n'est PAS chiffre par defaut : il est seulement
# encode en base64, ce qui est une transformation reversible par
# n'importe qui en une commande. Committer un Secret rempli dans Git
# revient exactement a committer un mot de passe en clair -- le probleme
# constate et corrige dans database.py, ou "opspilot_secret" figurait en
# valeur par defaut sur un depot public.
#
# TROIS FACONS CORRECTES de fournir ces valeurs en production, par ordre
# de preference :
#
#   1. External Secrets Operator / Vault -- le secret vit dans un coffre
#      dedie, Kubernetes ne fait que le referencer. Seule approche qui
#      permet la rotation automatique et l'audit des acces.
#
#   2. Sealed Secrets (Bitnami) -- le secret est chiffre avec la cle
#      publique du cluster, donc committable dans Git sans risque : seul
#      le controleur du cluster peut le dechiffrer. C'est la voie
#      GitOps.
#
#   3. kubectl create secret, a la main -- acceptable pour un deploiement
#      unique, mais rien n'est versionne et rien n'est reproductible.
#
# Ce fichier declare la STRUCTURE attendue (quelles cles l'application
# lit), avec stringData vide. Il documente le contrat sans exposer les
# valeurs.
#
# Creation manuelle equivalente :
#   kubectl create secret generic opspilot-secrets -n opspilot \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=GROQ_API_KEY='...' \
#     --from-literal=PROXMOX_TOKEN_SECRET='...' \
#     --from-literal=SSH_PASSWORD='...' \
#     --from-literal=SIGNUP_INVITE_CODE='...'
apiVersion: v1
kind: Secret
metadata:
  name: opspilot-secrets
  namespace: opspilot
  labels:
    app.kubernetes.io/name: opspilot
    app.kubernetes.io/component: backend
type: Opaque
# stringData plutot que data : accepte des valeurs en clair et les encode
# lui-meme. Evite l'erreur classique d'oublier l'encodage base64, qui
# produit un secret silencieusement invalide -- l'application demarre et
# echoue a s'authentifier, sans message clair.
stringData:
  DB_PASSWORD: ""            # mot de passe PostgreSQL
  GROQ_API_KEY: ""           # cle API Groq (analyse et chat)
  PROXMOX_TOKEN_SECRET: ""   # secret du jeton API Proxmox
  SSH_PASSWORD: ""           # acces SSH aux noeuds (actions KSM, logs)
  SIGNUP_INVITE_CODE: ""     # code d'invitation a l'inscription
  TAVILY_API_KEY: ""         # recherche documentaire
  SMTP_PASSWORD: ""          # notifications par courriel