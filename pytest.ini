[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
markers =
    unit: tests unitaires (fonctions isolées)
    integration: tests d'intégration (API + services)
    ml: tests modèle ML (LSTM + Isolation Forest)
    slow: tests lents (> 5s)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning