{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opspilot.serviceAccountName" . }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opspilot.fullname" . }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
rules:
  {{- /* Lecture seule, namespace courant uniquement. Un Role et non un
         ClusterRole : l'application n'a aucune raison de voir les autres
         namespaces. */}}
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opspilot.fullname" . }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opspilot.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opspilot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}