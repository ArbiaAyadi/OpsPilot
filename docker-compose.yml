# ------------------------------------------------------------------------------
# OpsPilot -- Orchestration locale
# ------------------------------------------------------------------------------
# Les PROFILS sont la clé de ce fichier. Un service sans profil démarre
# toujours ; un service avec profil ne démarre que si on le demande
# explicitement. Cela permet de DÉCLARER une architecture complète tout en
# n'exécutant que ce dont on a besoin -- indispensable ici, où la mémoire
# disponible est la contrainte principale.
#
#   docker compose up                          -> app + base seulement
#   docker compose --profile onprem up         -> + Ollama (modèle sur site)
#   docker compose --profile observability up  -> + Grafana
#
# Les profils onprem et observability sont donc documentés et déployables
# chez un client, sans jamais peser sur la machine de développement.

services:

  # ------------------------------------------------------------------------
  # Application -- l'agent OpsPilot
  # ------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: opspilot:latest
    container_name: opspilot-app
    restart: unless-stopped

    ports:
      - "8088:8088"

    # env_file plutôt que des variables en dur : les secrets restent dans
    # .env, qui n'est ni dans le dépôt Git ni dans l'image Docker. C'est
    # la seule façon correcte de les fournir -- une variable écrite ici
    # serait committée avec ce fichier.
    env_file:
      - .env

    environment:
      # DB_HOST surchargé : dans un réseau Docker, les services se joignent
      # par leur NOM, pas par IP. L'adresse 192.168.138.133 du .env vaut
      # pour une exécution hors conteneur ; ici c'est "db".
      DB_HOST: db
      DB_PORT: "5432"

    volumes:
      # Rapports générés : montés en volume pour survivre à la
      # reconstruction du conteneur. Sans cela, chaque mise à jour de
      # l'image effacerait l'historique des incidents.
      - ./rapports:/app/rapports
      # Certificats TLS : montés en LECTURE SEULE depuis l'hôte, jamais
      # embarqués dans l'image. Une clé privée dans une image se retrouve
      # dans le registre, puis sur chaque machine qui la récupère.
      - ./certs:/app/certs:ro
      # Polices du générateur PDF (DejaVu). En lecture seule également.
      - ./fonts:/app/fonts:ro

    depends_on:
      db:
        # service_healthy et non simplement "started" : PostgreSQL met
        # quelques secondes à accepter les connexions après le démarrage
        # du processus. Sans cette condition, l'application démarre trop
        # tôt et bascule en mode mémoire dégradé.
        condition: service_healthy

    networks:
      - opspilot

  # ------------------------------------------------------------------------
  # Base de données
  # ------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: opspilot-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-opspilot}
      POSTGRES_USER: ${DB_USER:-opspilot}
      # Aucune valeur par défaut pour le mot de passe : la syntaxe :? fait
      # échouer le démarrage avec un message explicite s'il est absent.
      # Un mot de passe par défaut dans un fichier versionné est
      # exactement le défaut qui a été corrigé dans database.py.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini dans .env}

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opspilot} -d ${DB_NAME:-opspilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - opspilot

    # Port NON exposé à l'hôte volontairement : la base n'est joignable
    # que depuis le réseau Docker interne. L'exposer serait une surface
    # d'attaque inutile. Pour un accès ponctuel en débogage :
    #   docker compose exec db psql -U opspilot -d opspilot

  # ------------------------------------------------------------------------
  # Ollama -- modèle auto-hébergé (profil onprem)
  # ------------------------------------------------------------------------
  # Ne démarre QUE sur demande explicite. Destiné au déploiement chez un
  # client où aucune donnée d'infrastructure ne doit sortir du réseau :
  # noms de nœuds, adresses IP, configuration des VMs et points faibles
  # constituent une cartographie du système d'information, que beaucoup
  # d'équipes sécurité refusent de voir transiter vers un tiers.
  #
  # Non démarré en développement : un modèle 8B demande 5 à 6 Go de RAM.
  ollama:
    image: ollama/ollama:latest
    container_name: opspilot-ollama
    profiles: [onprem]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - opspilot
    # Après le premier démarrage, télécharger un modèle :
    #   docker compose exec ollama ollama pull qwen3:8b
    # Puis dans .env :
    #   LLM_FALLBACK_PROVIDERS=ollama
    #   LLM_OLLAMA_URL=http://ollama:11434/v1
    #   LLM_OLLAMA_MODELS=qwen3:8b

  # ------------------------------------------------------------------------
  # Grafana -- tableaux de bord (profil observability)
  # ------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: opspilot-grafana
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Mot de passe de la source PostgreSQL, lu depuis .env -- jamais
      # ecrit dans le fichier de provisionnement.
      GF_DATASOURCE_PG_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisionnement automatique : sources de données et tableaux de
      # bord décrits en fichiers versionnés plutôt que configurés à la
      # main dans l'interface. C'est le principe dashboards-as-code -- un
      # tableau de bord perdu se recrée par un redéploiement, pas de
      # mémoire.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # <- AJOUT : tableaux de bord charges depuis des fichiers JSON
      # versionnes. Un tableau cree dans l'interface n'existe que dans la
      # base interne de Grafana : perdu si le conteneur est recree, et
      # invisible dans le depot. En fichier, il se relit, se compare en
      # revision de code, et se redeploie a l'identique.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - opspilot

  # ------------------------------------------------------------------------
  # Loki -- agregation de logs (profil observability)
  # ------------------------------------------------------------------------
  # Choisi plutot qu'Elasticsearch pour une raison de dimensionnement :
  # Elasticsearch indexe le CONTENU de chaque ligne et exige 2 Go de RAM
  # minimum. Loki n'indexe que les ETIQUETTES et stocke le texte
  # compresse -- quelques centaines de Mo suffisent.
  #
  # Sur une infrastructure contrainte, ce n'est pas un compromis : c'est
  # la difference entre une pile de logs qui tourne et une qui ne demarre
  # pas.
  loki:
    image: grafana/loki:3.3.2
    container_name: opspilot-loki
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - opspilot
    # Port non expose a l'hote : Loki n'est interroge que par Grafana,
    # depuis le reseau Docker interne.

  # ------------------------------------------------------------------------
  # Promtail -- collecte des logs vers Loki
  # ------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.3.2
    container_name: opspilot-promtail
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Socket Docker en LECTURE SEULE : permet a Promtail de decouvrir
      # les conteneurs et lire leurs logs. Un acces en ecriture
      # equivaudrait a donner le controle total de l'hote -- on peut
      # creer un conteneur privilegie par cette socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - ./rapports:/var/log/opspilot:ro
    depends_on:
      - loki
    networks:
      - opspilot

volumes:
  db-data:
  ollama-models:
  grafana-data:
  loki-data:

networks:
  opspilot:
    driver: bridge